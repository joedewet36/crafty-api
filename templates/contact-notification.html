<div style="font-family: Arial, sans-serif; color: #333; line-height:1.4;">
  <div style="display:flex; align-items:center; gap:12px; margin-bottom:16px;">
    <img src="cid:craftylogo@craftydesignstudio" alt="Crafty Logo" style="height:48px">
    <h2 style="margin:0; font-size:18px">New contact form submission</h2>
  </div>
  <div style="background:#f9f9f9; padding:12px; border-radius:6px;">
    <p><strong>Name:</strong> <%= name %></p>
    <p><strong>Email:</strong> <%= email %></p>
    <p><strong>Phone:</strong> <%= phone %></p>
    <p><strong>Subject:</strong> <%= subject %></p>
    <% if (package) { %><p><strong>Package:</strong> <%= package %></p><% } %>
    <p><strong>Message:</strong><br><%= message %></p>
  </div>
  <p style="font-size:12px; color:#666; margin-top:12px;">This message was submitted from the website contact form.</p>
</div>
